name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Installer les dépendances
        run: npm ci
      - name: Accepter les licences du SDK Android (préinstallé sur le runner)
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - name: Installer la plateforme et les build-tools nécessaires
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Synchroniser le projet Capacitor
        run: npx cap sync android
      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew
      - name: Compiler l'APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: isaac-transformer-single-stage-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
